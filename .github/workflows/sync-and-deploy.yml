name: Sync connected Mid Valley malls and deploy

on:
  workflow_dispatch:
  schedule:
    - cron: '17 22 * * *'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'styles.css'
      - 'app.js'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'data/**'
      - 'scripts/**'
      - '.github/workflows/sync-and-deploy.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  sync-and-deploy:
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Sync Mid Valley Megamall official directory
        run: node scripts/sync-places.mjs

      - name: Sync The Gardens Mall official floor map
        run: node scripts/sync-gardens.mjs

      - name: Sync INC KL Eco City official directory
        run: node scripts/sync-inc.mjs

      - name: Build verified topology
        run: python3 scripts/build-topology.py

      - name: Commit refreshed generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/places.generated.json data/gardens.generated.json data/inc.generated.json data/topology.generated.json
          if git diff --cached --quiet; then
            echo "No generated-data changes to commit."
          else
            git commit -m "Refresh connected mall directory and verified route data"
            if ! git push; then
              echo "Remote branch advanced while this run was active; skipping only the persistence push. Deployment will continue using freshly generated data from this run."
            fi
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
